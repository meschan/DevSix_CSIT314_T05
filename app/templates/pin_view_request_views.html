<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Request Views</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <h3 class="mb-3">My Request Views</h3>
  <p class="text-muted">Owner: {{ owner }}</p>

  {% if not rows %}
    <div class="alert alert-info">You have not created any requests yet.</div>
  {% else %}
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th style="width:80px;">ID</th>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Created At</th>
            <th style="width:110px;">Views</th>
          </tr>
        </thead>
        <tbody>
        {% for r in rows %}
          <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.title }}</td>
            <td>{{ r.category }}</td>
            <td>{{ r.status }}</td>
            <td>{{ r.created_at }}</td>
            <td><span class="badge bg-secondary">{{ r.views }}</span></td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  {% endif %}

  <a href="{{ url_for('pin_home.home') }}" class="btn btn-outline-secondary mt-3">
    Back to PIN Home
  </a>
</div>
</body>
</html>
