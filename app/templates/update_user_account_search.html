<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Update User Account - Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-4 text-center">Update User Account</h3>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{ category }} mb-3 text-center">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" action="{{ url_for('update_user_account.search_submit') }}">
            <label class="form-label" for="username">Enter Username</label>
            <div class="input-group mb-3">
              <input id="username" name="username" type="text" class="form-control"
                     placeholder="e.g. alice" value="{{ username or '' }}" required>
              <button class="btn btn-primary" type="submit">Search</button>
            </div>
          </form>

          <div class="text-center mt-3">
            <a href="{{ url_for('user_admin_home.home') }}" class="btn btn-outline-secondary">
              Back to Admin Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
