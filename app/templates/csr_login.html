<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CSR Rep Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="mb-3">CSR Rep Login</h2>
          <p class="text-muted">Sign in as a CSR Representative.</p>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{ category }} mb-3">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" action="{{ url_for('csr_login.login_submit') }}">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input id="username" name="username" type="text" class="form-control" placeholder="Enter username">
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input id="password" name="password" type="password" class="form-control" placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary w-100">LOGIN</button>
          </form>

          <div class="text-center mt-3">
            <a href="{{ url_for('landing.index') }}" class="btn btn-link">Back to Index</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
