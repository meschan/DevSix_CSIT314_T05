<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user_admin_login.css') }}">
</head>
<body>
<div class="login-card">
  <h1 class="login-title">Login</h1>
  <p class="login-subtitle">Sign in as <strong>User Admin</strong></p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="alert {% if category == 'error' %}alert-error{% elif category == 'success' %}alert-success{% else %}alert-info{% endif %}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('admin_login.submit_login') }}">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input id="username" type="text" name="username" class="form-input" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input id="password" type="password" name="password" class="form-input" placeholder="Enter password">
    </div>

    <button type="submit" class="btn-primary">LOGIN</button>
  </form>

  <!-- ↓ 新增：去创建账号的链接（/admin/users/create） -->
  <div class="text-center" style="margin-top: 12px;">
    <a href="{{ url_for('create_user.create_form') }}" class="muted-link">Create an account</a>
  </div>
</div>
</body>
</html>
