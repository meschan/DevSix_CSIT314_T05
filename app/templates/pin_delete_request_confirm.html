<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Confirm Delete Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">

          <h3 class="mb-4 text-center text-danger">Confirm Delete</h3>

          <p class="mb-3 text-center">
            Are you sure you want to delete this request?
          </p>

          <div class="border rounded p-3 mb-4 bg-light">
            <h5 class="mb-1">{{ req.title }}</h5>
            <p class="mb-1">
              <strong>Service Category:</strong> {{ req.category }}
            </p>
            <p class="mb-0">
              <strong>Description:</strong><br>
              {{ req.description or "No description provided." }}
            </p>
          </div>

          <form
            method="post"
            action="{{ url_for('pin_delete_request.delete_submit', req_id=req.id) }}"
            class="d-flex justify-content-between"
          >
            <a
              href="{{ url_for('pin_delete_request.list_requests') }}"
              class="btn btn-outline-secondary"
            >
              Cancel
            </a>

            <button type="submit" class="btn btn-danger">
              Confirm Delete
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
