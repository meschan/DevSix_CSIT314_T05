<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Suspend User Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body">

          <h3 class="mb-3 text-center">Suspend User Profile</h3>
          <p class="text-muted text-center mb-4">
            Select one of the existing user profiles and suspend it.
          </p>

          {# flash messages #}
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              <div class="mb-3">
                {% for category, msg in messages %}
                  <div class="alert alert-{{ category }} text-center mb-2">
                    {{ msg }}
                  </div>
                {% endfor %}
              </div>
            {% endif %}
          {% endwith %}

          <form method="post" action="{{ url_for('suspend_user_profile.submit_suspend') }}">
            <div class="mb-3">
              <label for="profile_id" class="form-label">User Profile</label>
              <select id="profile_id" name="profile_id" class="form-select">
                <option value="">-- Select profile --</option>
                {% for p in profiles %}
                  <option value="{{ p.id }}"
                          {% if selected_profile_id and selected_profile_id == p.id %}selected{% endif %}>
                    {{ p.name }} — ({{ p.status }})
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="d-grid gap-2 mt-3">
              <button type="submit" class="btn btn-danger">
                Suspend
              </button>
              <a href="{{ url_for('user_admin_home.home') }}"
                 class="btn btn-outline-secondary">
                Back to Admin Home
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
