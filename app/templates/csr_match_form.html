<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Match Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h3 class="mb-3">Match Request #{{ req.id }}</h3>
          <p class="text-muted">Owner: <strong>{{ req.owner_username or req.pin_username }}</strong></p>

          <form method="post" action="{{ url_for('csr_view_shortlisted_request.match_submit', req_id=req.id) }}">
            <div class="mb-3">
              <label class="form-label">Choose a PIN (cannot be the owner)</label>
              <select class="form-select" name="pin_username" required>
                <option value="">-- Select --</option>
                {% for u in candidates %}
                  <option value="{{ u }}">{{ u }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Match</button>
              <a class="btn btn-outline-secondary"
                 href="{{ url_for('csr_view_shortlisted_request.list_shortlisted') }}">Cancel</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
