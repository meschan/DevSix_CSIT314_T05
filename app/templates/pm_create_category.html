<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Create New Category</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3 text-center">Create New Category</h3>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{ category }} text-center mb-3">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" action="{{ url_for('pm_create_category.create_submit') }}">
            <div class="mb-3">
              <label class="form-label" for="name">Category Name</label>
              <input id="name" name="name" type="text" class="form-control"
                     placeholder="e.g. Wheelchair Transfer"
                     value="{{ last_name or '' }}" required>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Save</button>
              <a href="{{ url_for('pm_home.home') }}" class="btn btn-outline-secondary">Back to PM Home</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
