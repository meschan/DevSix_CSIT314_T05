<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Request #{{ request_obj.id }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body">

          <h3 class="mb-4 text-center">
            Edit Request #{{ request_obj.id }}
          </h3>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              <div class="mb-3">
                {% for category, msg in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else category }} text-center mb-2">
                    {{ msg }}
                  </div>
                {% endfor %}
              </div>
            {% endif %}
          {% endwith %}

          <form method="post">
            <!-- Title -->
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input
                type="text"
                name="title"
                class="form-control"
                value="{{ request_obj.title }}"
                placeholder="e.g. Help with grocery shopping"
              >
            </div>

            <!-- Service Category -->
            <div class="mb-3">
              <label class="form-label">Service Category</label>
              <select name="service_category" class="form-select">
                <option value="">-- Please select --</option>
                {% for cat in categories %}
                  <option value="{{ cat }}"
                          {% if request_obj.service_category == cat %}selected{% endif %}>
                    {{ cat }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <!-- Description -->
            <div class="mb-4">
              <label class="form-label">Description</label>
              <textarea
                name="description"
                class="form-control"
                rows="4"
                placeholder="Please describe what kind of help you need"
              >{{ request_obj.description }}</textarea>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">
                Update
              </button>
              <a
                href="{{ url_for('pin_update_request.list_requests') }}"
                class="btn btn-outline-secondary"
              >
                Cancel
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
