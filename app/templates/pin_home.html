<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PIN Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body">

          <h3 class="mb-4 text-center">Person In Need Dashboard</h3>

            {% with messages = get_flashed_messages(with_categories=true) %}
             {% if messages %}
               {% for category, msg in messages %}
                 <div class="alert alert-{{ category }} text-center mb-3">
                     {{ msg }}
                 </div>
               {% endfor %}
             {% endif %}
            {% endwith %}

          <div class="d-grid gap-3 mb-4">
            <a href="{{ url_for('pin_create_request.create_form') }}"
               class="btn btn-primary">Create Request</a>
            <a href="{{ url_for('pin_view_request.list_requests') }}"
               class="btn btn-outline-primary">View Request</a>
            <a href="{{ url_for('pin_update_request.list_requests') }}"
               class="btn btn-outline-secondary">Update Request</a>
            <a href="{{ url_for('pin_delete_request.list_requests') }}"
               class="btn btn-outline-danger">Delete Request</a>
            <a href="{{ url_for('pin_search_request.search_form') }}"
               class="btn btn-outline-info">Search Request</a>
          </div>

          <hr>

          <!-- Logout Button -->
          <div class="d-grid">
            <a href="{{ url_for('pin_home.logout') }}"
               class="btn btn-outline-dark">
              Log out
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
