<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CSR Rep Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
          <h3 class="mb-3">CSR Rep Dashboard</h3>
          <p class="text-muted mb-4">Welcome, {{ username }}.</p>

          <!-- Search for request -->
          <a href="{{ url_for('csr_search_request.list_page') }}" class="btn btn-primary w-100">
            Search for Request
          </a>

          <a href="{{ url_for('csr_shortlist.view_shortlist') }}" class="btn btn-outline-primary w-100 mt-3">
            View Saved Opportunities
          </a>

          <a href="{{ url_for('csr_login.login_form') }}" class="btn btn-outline-secondary">Log out</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
