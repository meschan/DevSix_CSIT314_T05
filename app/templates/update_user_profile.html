<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Update User Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm rounded-4">
        <div class="card-body p-4">

          <h2 class="mb-3 text-center">Update User Profile</h2>
          <p class="text-muted text-center mb-4">
            Select a user and assign a new profile (role).
          </p>

          <!-- flash -->
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{ category }} mb-3">
                  {{ msg }}
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" action="{{ url_for('update_user_profile.submit_update') }}">

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <select id="username" name="username" class="form-select">
                <option value="">-- Select user --</option>
                {% for u in users %}
                  <option value="{{ u.username }}"
                    {% if selected_username == u.username %}selected{% endif %}
                  >
                    {{ u.username }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-3">
              <label for="profile_id" class="form-label">User Profile</label>
              <select id="profile_id" name="profile_id" class="form-select">
                <option value="">-- Select profile --</option>
                {% for p in profiles %}
                  <option value="{{ p.id }}"
                    {% if selected_profile_id == p.id %}selected{% endif %}
                  >
                    {{ p.name }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="d-grid gap-2 mt-3">
              <button type="submit" class="btn btn-primary">Update</button>
              <a href="{{ url_for('user_admin_home.home') }}"
                 class="btn btn-outline-secondary">
                Back to Admin Home
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
