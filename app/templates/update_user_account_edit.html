<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Edit User Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  >
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h3 class="mb-4 text-center">Edit User Account</h3>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{ category }} mb-3 text-center">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <div class="mb-3">
            <div><strong>Username:</strong> {{ user.username }}</div>
            <div><strong>Role:</strong> {{ user.role.value }}</div>
          </div>
          <hr>

          <form method="post" action="{{ url_for('update_user_account.update_submit', username=user.username) }}">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" name="email" type="email" class="form-control"
                     value="{{ (form_data.email if form_data else user.email) }}">
            </div>

            <div class="mb-3">
              <label class="form-label" for="phone_number">Phone Number</label>
              <input id="phone_number" name="phone_number" type="text"
                     class="form-control"
                     value="{{ (form_data.phone_number if form_data else user.phone_number) }}">
            </div>

            <div class="mb-3">
              <label class="form-label" for="address">Address</label>
              <input id="address" name="address" type="text"
                     class="form-control"
                     value="{{ (form_data.address if form_data else user.address) }}">
            </div>

            <div class="mb-4">
              <label class="form-label" for="password">New Password (optional)</label>
              <input id="password" name="password" type="password" class="form-control"
                     placeholder="Leave blank to keep current password">
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Update</button>
              <a href="{{ url_for('update_user_account.search_form') }}" class="btn btn-outline-secondary">
                Back to Search
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
